<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Configuration de fontconfig de fontconfig pour la génération d'images (sharp / Pango) :
     sans elle, sur macOS, les polices du dépôt ne sont pas trouvées et une police par défaut est utilisée.
     Utilisée avec PANGOCAIRO_BACKEND=fc (voir package.json). -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
