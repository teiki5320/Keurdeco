name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  # Chaque lundi, mercredi et vendredi à 5 h UTC (7 h à Paris en été, 6 h en hiver) : publie les articles programmés.
  schedule:
    - cron: '0 5 * * 1,3,5'
    # 2 fois par jour, après la veille (12 h et 19 h à Paris) : pages des nouveaux articles d'actus (/actus/<slug>/).
    # 11 h 50 et 18 h 50 UTC = 12 h 50 et 19 h 50 à Paris l'hiver (13 h 50 et 20 h 50 l'été).
    - cron: '50 11,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Réglages facultatifs : Settings › Secrets and variables › Actions › Variables.
  SITE_URL: ${{ vars.SITE_URL || 'https://www.keurdeco.com/' }}
  PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
  CLOUDFLARE_WEB_ANALYTICS: ${{ vars.CLOUDFLARE_WEB_ANALYTICS }}
  PINTEREST_VERIFY: ${{ vars.PINTEREST_VERIFY }}
  GOOGLE_VERIFY: ${{ vars.GOOGLE_VERIFY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : la date du dernier commit des pages fixes sert de <lastmod> au sitemap.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Génère aussi les épingles Pinterest (public/epingles/) et leur manifeste (epingles.json).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Après la publication du lundi, mercredi et vendredi, après chaque reconstruction de la veille (pages /actus/ seulement)
  # ou à la demande : signale les pages à Bing via IndexNow.
  indexnow:
    needs: deploy
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
        env:
          # Reconstruction d'après la veille : on ne signale que les pages d'articles d'actus.
          INDEXNOW_FILTRE: ${{ github.event.schedule == '50 11,18 * * *' && '/actus/' || '' }}
