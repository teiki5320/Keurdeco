name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  # Chaque lundi à 5 h UTC (7 h à Paris en été, 6 h en hiver) : publie les articles programmés.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Réglages facultatifs : Settings › Secrets and variables › Actions › Variables.
  SITE_URL: ${{ vars.SITE_URL || 'https://teiki5320.github.io/Keurdeco/' }}
  PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
  PINTEREST_VERIFY: ${{ vars.PINTEREST_VERIFY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Génère aussi les épingles Pinterest (public/epingles/) et leur manifeste (epingles.json).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
