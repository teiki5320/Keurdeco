name: Synchroniser les produits Amazon

# Quotidien (et non hebdomadaire) : la licence Amazon impose de ne pas garder plus de 24 h
# les titres et adresses d'images lus par l'API. Après une synchronisation qui change quelque
# chose, le site est reconstruit. Sans identifiants Creators API, le script s'arrête proprement.
on:
  schedule:
    - cron: '7 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: amazon-sync
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchroniser
        env:
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
          AMAZON_CREATORS_VERSION: ${{ vars.AMAZON_CREATORS_VERSION || '3.2' }}
          AMAZON_SYNC_NOMS: ${{ vars.AMAZON_SYNC_NOMS }}
        run: node scripts/amazon-sync.mjs
      - name: Enregistrer sur main et reconstruire le site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "keurdeco-bot"
          git config user.email "keurdeco-bot@users.noreply.github.com"
          git add src/data/produits.json
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git commit -m "Amazon : synchronisation des produits du $(TZ=Europe/Paris date +%F)"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((i * 5)); done
          # Un push fait avec le jeton du workflow ne relance pas les autres workflows : on relance la publication.
          gh workflow run pages.yml --ref main
